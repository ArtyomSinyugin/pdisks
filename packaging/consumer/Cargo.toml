[package]
name = "disksgraph-consumer-example"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "GPL-3.0-only"

# This SDK is intentionally standalone: it links no facade, runtime or provider crate.
[workspace]

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"

[dependencies]
libloading = "=0.9.0"
serde_json = { version = "1.0.91", features = ["preserve_order"] }
stabby = { version = "=72.1.16", features = ["libloading"] }
