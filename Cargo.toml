[workspace]
resolver = "2"
members = [
    "storage-core",
    "storage-provider",
    "storage-probe",
]

[workspace.package]
rust-version = "1.88.0"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "deny"
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
storage-core = { version = "0.1.0", path = "storage-core" }
storage-probe = { version = "0.1.0", path = "storage-probe" }

serde = { version = "1.0.215", features = ["derive"] }
serde_json = { version = "1.0.91", features = ["preserve_order"] }
serde_with = "3.16.1"
thiserror = "2.0.18"
tracing = "0.1.41"

stabby = "72.1.16"
libloading = "0.9.0"
uuid = { version = "1.26.0", features = ["v7", "serde"] }
