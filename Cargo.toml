[workspace]
resolver = "2"
members = [
    "storage-core",
    "storage-engine",
    "storage-provider",
    "storage-probe",
    "storage-runtime",
    "disksgraph",
    "dg-cli",
]

[workspace.package]
rust-version = "1.88.0"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "deny"
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
storage-runtime = { version = "0.1.0", path = "storage-runtime" }
disksgraph = { version = "0.1.0", path = "disksgraph" }
storage-engine = { version = "0.1.0", path = "storage-engine" }
storage-core = { version = "0.1.0", path = "storage-core" }
storage-provider = { version = "0.1.0", path = "storage-provider" }
storage-probe = { version = "0.1.0", path = "storage-probe" }

serde = { version = "1.0.215", features = ["derive"] }
serde_json = { version = "1.0.91", features = ["preserve_order"] }
thiserror = "2.0.18"
libloading = "0.9.0"
uuid = { version = "1.26.0", features = ["v7", "serde"] }
